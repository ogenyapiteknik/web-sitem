        <style>
            /* ================= ANASAYFA SLIDER ================= */
            .og-slider { --w: 60%; --shift: 88%; position: relative; max-width: 1500px; margin: 0 auto; overflow: hidden; padding: 16px 0 32px; user-select: none; -webkit-user-select: none; touch-action: pan-y; outline: none; }
            .og-stage { position: relative; height: clamp(200px, 36vw, 520px); perspective: 1400px; }
            .og-slide { position: absolute; top: 0; left: 50%; width: var(--w); height: 100%; margin: 0; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 12px 28px rgba(0, 0, 0, .4);
                transform: translateX(-50%) scale(.6); opacity: 0; pointer-events: none; z-index: 1; cursor: pointer;
                transition: transform .7s cubic-bezier(.22, .8, .26, 1), opacity .7s ease, filter .7s ease; will-change: transform, opacity, filter; }
            .og-slide img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none; }
            /* JS çalışmasa bile ilk fotoğraf görünsün (yedek) */
            .og-slider:not(.og-ready) .og-slide:first-child { transform: translateX(-50%) scale(1); opacity: 1; z-index: 3; pointer-events: auto; }
            .og-slide.is-center { transform: translateX(-50%) scale(1); opacity: 1; filter: none; z-index: 3; pointer-events: auto; cursor: zoom-in; }
            .og-slide.is-left  { transform: translateX(calc(-50% - var(--shift))) rotateY(10deg) scale(.8);  opacity: 1; filter: brightness(.5); z-index: 2; pointer-events: auto; }
            .og-slide.is-right { transform: translateX(calc(-50% + var(--shift))) rotateY(-10deg) scale(.8); opacity: 1; filter: brightness(.5); z-index: 2; pointer-events: auto; }
            .og-slide.is-left:hover, .og-slide.is-right:hover { filter: brightness(.72); }
            .og-dots { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
            .og-dot { width: 9px; height: 9px; padding: 0; border: 0; border-radius: 999px; background: rgba(255, 255, 255, .35); transition: width .35s ease, background .35s ease; cursor: pointer; }
            .og-dot.is-active { width: 24px; background: #fff; }
            @media (max-width: 767.98px) {
                .og-slider { --w: 70%; --shift: 86%; }
                .og-stage { height: clamp(190px, 60vw, 340px); }
            }

            /* ================= BÜYÜK GÖRÜNÜM (LIGHTBOX) ================= */
            .og-lightbox { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, .88); opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility .35s ease; cursor: zoom-out; }
            .og-lightbox.is-open { opacity: 1; visibility: visible; }
            .og-lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 8px; box-shadow: 0 20px 60px rgba(0, 0, 0, .6); transform: scale(.94); transition: transform .35s ease; cursor: default; background: #fff; }
            .og-lightbox.is-open img { transform: scale(1); }
            .og-lb-close { position: absolute; top: 14px; right: 18px; width: 44px; height: 44px; border: 0; background: transparent; color: #fff; font-size: 38px; line-height: 1; cursor: pointer; opacity: .85; }
            .og-lb-close:hover { opacity: 1; }

            @media (prefers-reduced-motion: reduce) {
                .og-slide, .og-lightbox, .og-lightbox img, .og-dot { transition: none; }
            }
        </style>
    </head>

            <!-- Header: Slider-->

        <script src="js/scripts.js"></script>
        <!-- Slider JS-->
        <script>
            (function () {
                var root = document.getElementById('ogSlider');
                if (!root) return;

                var slides = [].slice.call(root.querySelectorAll('.og-slide'));
                var dotsBox = root.querySelector('.og-dots');
                var lb = document.getElementById('ogLightbox');
                var lbImg = lb.querySelector('img');
                var n = slides.length;
                var cur = 0;
                var lastSwipe = 0;
                var dots = [];
                root.classList.add('og-ready');

                // Nokta göstergeleri
                slides.forEach(function (s, i) {
                    var d = document.createElement('button');
                    d.type = 'button';
                    d.className = 'og-dot';
                    d.setAttribute('aria-label', (i + 1) + '. fotoğraf');
                    d.addEventListener('click', function () { go(i); });
                    dotsBox.appendChild(d);
                    dots.push(d);
                });

                // Bir slaytın ortaya göre konumu: 0 = orta, -1 = sol, 1 = sağ
                function offset(i) {
                    var half = Math.floor(n / 2);
                    return ((i - cur + n + half) % n) - half;
                }

                function render() {
                    slides.forEach(function (s, i) {
                        var o = offset(i);
                        s.classList.remove('is-center', 'is-left', 'is-right');
                        if (o === 0) s.classList.add('is-center');
                        else if (o === -1) s.classList.add('is-left');
                        else if (o === 1) s.classList.add('is-right');
                        s.setAttribute('aria-hidden', o === 0 ? 'false' : 'true');
                    });
                    dots.forEach(function (d, i) {
                        d.classList.toggle('is-active', i === cur);
                    });
                }

                function go(i) {
                    cur = ((i % n) + n) % n;
                    render();
                }

                // Tıklama: yan fotoğraf -> geçiş, orta fotoğraf -> büyük aç
                slides.forEach(function (s, i) {
                    s.addEventListener('click', function () {
                        if (Date.now() - lastSwipe < 400) return;
                        var o = offset(i);
                        if (o === 0) openLightbox(i);
                        else if (o === -1) go(cur - 1);
                        else if (o === 1) go(cur + 1);
                    });
                });

                // Mobilde parmakla kaydırma
                var x0 = 0, y0 = 0;
                root.addEventListener('touchstart', function (e) {
                    x0 = e.touches[0].clientX;
                    y0 = e.touches[0].clientY;
                }, { passive: true });
                root.addEventListener('touchend', function (e) {
                    var dx = e.changedTouches[0].clientX - x0;
                    var dy = e.changedTouches[0].clientY - y0;
                    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) {
                        lastSwipe = Date.now();
                        go(cur + (dx < 0 ? 1 : -1));
                    }
                }, { passive: true });

                // Büyük görünüm
                function openLightbox(i) {
                    var img = slides[i].querySelector('img');
                    lbImg.src = img.getAttribute('src');
                    lbImg.alt = img.getAttribute('alt') || '';
                    lb.classList.add('is-open');
                    lb.setAttribute('aria-hidden', 'false');
                    document.body.style.overflow = 'hidden';
                }
                function closeLightbox() {
                    lb.classList.remove('is-open');
                    lb.setAttribute('aria-hidden', 'true');
                    document.body.style.overflow = '';
                }
                // Fotoğrafın dışındaki karanlık alana (veya X'e) tıklayınca kapan
                lb.addEventListener('click', function (e) {
                    if (e.target !== lbImg) closeLightbox();
                });

                // Klavye: sağ/sol ok ve Esc
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape' && lb.classList.contains('is-open')) { closeLightbox(); return; }
                    if (lb.classList.contains('is-open')) return;
                    if (e.key === 'ArrowLeft' && root.contains(document.activeElement)) go(cur - 1);
                    if (e.key === 'ArrowRight' && root.contains(document.activeElement)) go(cur + 1);
                });

                render();
            })();
        </script>
    </body>
