<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Ogen Yapı Teknik: kaba ve ince inşaat, çelik ve metal işleri, çatı-cephe, saha düzenleme, izolasyon ve yüzey kaplama." />
    <title>Ogen Yapı Teknik</title>
    <link rel="icon" href="assets/favicon.ico" />
    <link href="css/styles.css" rel="stylesheet" />
    <style>
        :root{--og-red:#c8102e;--og-bg:#16191c;--og-card:#1e2226;--og-line:rgba(255,255,255,.1)}
        body{background:var(--og-bg);color:#e9ecef;margin:0}
        .og-nav{background:#0f1113;border-bottom:1px solid var(--og-line)}
        .og-brand-text{font-weight:700;font-size:.95rem;letter-spacing:.04em;color:var(--og-red);position:relative;top:8px}
        .og-logo{height:64px;width:auto;margin:-8px 0 -24px;display:block}
        .og-nav .nav-link{color:rgba(255,255,255,.78);font-size:.9rem;padding:.5rem .75rem}
        .og-nav .nav-link:hover,.og-nav .nav-link.active{color:#fff}
        .hero{padding:35px 0 34px;background:radial-gradient(circle at 78% 35%,rgba(200,16,46,.08),transparent 55%),var(--og-bg);overflow-x:clip}
        .hero-copy{position:relative;z-index:3}
        .eyebrow{color:var(--og-red);font-weight:700;letter-spacing:.12em;font-size:.76rem;text-transform:uppercase}
        .hero h1{font-size:clamp(1.8rem,3.1vw,2.45rem);font-weight:800;color:#fff;line-height:1.12}
        .hero p{font-size:.82rem;color:rgba(255,255,255,.68);max-width:500px;line-height:1.65}
        .hero-media-wrap{position:relative;padding-bottom:28px}
        .hero-frame{position:relative;aspect-ratio:16/10;isolation:isolate;--peek:24%}
        .hero-slide{position:absolute;inset:0;border-radius:10px;overflow:hidden;border:1px solid var(--og-line);background:#101315;transition:transform .45s ease,opacity .45s ease}
        .hero-slide img{width:100%;height:100%;object-fit:cover;display:block}
        .hero-slide.is-current{z-index:2;box-shadow:0 20px 50px rgba(0,0,0,.45)}
        .hero-slide.is-prev,.hero-slide.is-next{z-index:1;opacity:.4;cursor:pointer}
        .hero-slide.is-prev:hover,.hero-slide.is-next:hover{opacity:.6}
        .hero-slide.is-prev{transform:translateX(calc(-7% - var(--peek))) scale(.86)}
        .hero-slide.is-next{transform:translateX(calc(7% + var(--peek))) scale(.86)}
        .hero-side-btn{position:absolute;top:0;bottom:0;width:54px;background:transparent;border:0;padding:0;cursor:pointer;z-index:2;display:flex;align-items:center}
        .hero-side-btn.prev{left:0;justify-content:flex-start;padding-left:14px}
        .hero-side-btn.next{right:0;justify-content:flex-end;padding-right:14px}
        .hero-side-btn span{width:38px;height:38px;border-radius:50%;background:rgba(15,17,19,.55);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:1.35rem;line-height:1;display:flex;align-items:center;justify-content:center;opacity:.85;transition:opacity .2s,background .2s,border-color .2s}
        .hero-side-btn:hover span{opacity:1;background:rgba(15,17,19,.88);border-color:var(--og-red)}
        .hero-tag{position:absolute;right:14px;bottom:14px;z-index:3;background:rgba(15,17,19,.88);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:.78rem;font-weight:600;padding:6px 12px;border-radius:6px;max-width:90%;pointer-events:none}
        #heroSliderImg{cursor:zoom-in}
        .og-lightbox{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:32px}
        .og-lightbox.open{display:flex}
        .og-lightbox img{max-width:94vw;max-height:90vh;object-fit:contain;cursor:zoom-out}
        .og-lightbox-close{position:absolute;top:16px;right:22px;border:0;background:transparent;color:#fff;font-size:38px;line-height:1;cursor:pointer}
        .hero-counter{position:absolute;right:0;bottom:0;background:#0f1113;border:1px solid var(--og-line);color:rgba(255,255,255,.75);font-size:.74rem;padding:3px 9px;border-radius:4px}
        .trust{background:#191d21;border-top:1px solid var(--og-line);border-bottom:1px solid var(--og-line)}
        .trust-item{padding:14px 10px;text-align:center;font-size:.84rem;color:rgba(255,255,255,.62)}
        .trust-item strong{display:block;color:#fff;font-size:.95rem;font-weight:700;margin-bottom:2px}
        .sec{padding:52px 0}
        .sec-title{font-size:clamp(1.35rem,2.25vw,1.8rem);font-weight:700;color:#fff}
        .sec-sub{color:rgba(255,255,255,.6);font-size:.78rem;max-width:640px}
        .svc{background:var(--og-card);border:1px solid var(--og-line);border-radius:10px;overflow:hidden;height:100%;display:flex;flex-direction:column;transition:transform .25s,border-color .25s;text-decoration:none;color:inherit}
        .svc:hover{transform:translateY(-4px);border-color:var(--og-red);color:inherit}
        .svc-media{position:relative;overflow:hidden;aspect-ratio:16/10;background:#101315}
        .svc-media.wide{aspect-ratio:16/8.5}
        .svc-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
        .svc:hover .svc-media img{transform:scale(1.03)}
        .svc-badge{position:absolute;right:10px;bottom:10px;background:rgba(15,17,19,.86);color:#fff;font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:5px}
        .svc-body{padding:12px 13px 13px;display:flex;flex-direction:column;flex:1}
        .svc h3{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:6px}
        .svc p{font-size:.72rem;color:rgba(255,255,255,.62);margin:0;line-height:1.5}
        .svc .more{display:inline-block;margin-top:auto;padding-top:8px;color:var(--og-red);font-weight:600;font-size:.85rem}
        .gal-sec{background:#121518;border-top:1px solid var(--og-line);border-bottom:1px solid var(--og-line)}
        .gal{display:grid;grid-template-columns:1.35fr 1fr 1fr;grid-template-rows:repeat(2,160px);gap:7px}
        .gal-item{position:relative;display:block;overflow:hidden;border-radius:8px;border:1px solid var(--og-line);text-decoration:none}
        .gal-item.main{grid-row:span 2}
        .gal-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
        .gal-item:hover img{transform:scale(1.04)}
        .gal-cap{display:none}
        .gal-item.main .gal-cap{display:none}
        .step{border-left:2px solid var(--og-red);padding:2px 0 2px 13px;height:100%}
        .step b{color:var(--og-red);font-size:.95rem;font-weight:700;display:block;margin-bottom:4px}
        .step h3{font-size:1rem;font-weight:700;color:#fff;margin:0 0 4px}
        .step p{font-size:.85rem;color:rgba(255,255,255,.6);margin:0;line-height:1.5}
        .cta{background:var(--og-red);color:#fff;padding:18px 0}
        .cta-title{font-size:1.15rem;font-weight:700;margin:0}
        .cta a.tel{color:#fff;font-size:1.1rem;font-weight:700;text-decoration:none}
        .og-footer{background:#0e1012;color:rgba(255,255,255,.45);font-size:.68rem;padding:14px 0;text-align:center}
        .mbar{display:none}
        @media(min-width:992px){
            .hero .row{--bs-gutter-x:2.6rem}
            .trust-item{font-size:.72rem}
            .trust-item strong{font-size:.78rem}
            .sec .row{--bs-gutter-y:1rem}
            .step b{font-size:.9rem}
            .step h3{font-size:.78rem}
            .step p{font-size:.68rem}
        }
        @media(max-width:991px){
            .hero-frame{--peek:12%}
            .gal{grid-template-columns:1fr 1fr;grid-template-rows:220px repeat(2,160px)}
            .gal-item.main{grid-column:span 2;grid-row:span 1}
        }
        @media(max-width:767px){
            .sec{padding:48px 0}.hero{padding:36px 0 44px}
            .gal{grid-template-columns:1fr 1fr;grid-template-rows:200px repeat(2,140px)}
            .hero-side-btn{width:48px}
            .hero-side-btn span{width:32px;height:32px;font-size:1.15rem}
            .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1500;background:#0f1113;border-top:1px solid var(--og-line)}
            .mbar a{flex:1;text-align:center;padding:13px 6px;color:#fff;font-weight:600;text-decoration:none;font-size:.9rem}
            .mbar a.main{background:var(--og-red)}
            body{padding-bottom:48px}
        }
    </style>
</head>
