<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Ogen Yapı Teknik: kaba ve ince inşaat, çelik ve metal işleri, çatı-cephe, saha düzenleme, izolasyon ve yüzey kaplama. Çorlu / Tekirdağ merkezli, Türkiye geneli hizmet." />
    <title>Ogen Yapı Teknik</title>
    <link rel="icon" href="assets/favicon.ico" />
    <link href="css/styles.css" rel="stylesheet" />
    <style>
        :root {
            --og-red: #c8102e;
            --og-bg: #16191c;
            --og-card: #1e2226;
            --og-line: rgba(255,255,255,.1);
        }
        body {
            background: var(--og-bg);
            color: #e9ecef;
            margin: 0;
        }
        /* Navbar */
        .og-nav {
            background: #0f1113;
            border-bottom: 1px solid var(--og-line);
        }
        .og-brand-text {
            font-weight: 700;
            font-size: .95rem;
            letter-spacing: .04em;
            color: #fff;
        }
        .og-nav .nav-link {
            color: rgba(255,255,255,.78);
            font-size: .9rem;
            padding: .5rem .75rem;
        }
        .og-nav .nav-link:hover,
        .og-nav .nav-link.active {
            color: #fff;
        }

        /* Hero + Slider */
        .hero {
            padding: 56px 0 64px;
            background: radial-gradient(circle at 78% 35%, rgba(200,16,46,.08), transparent 55%), var(--og-bg);
        }
        .eyebrow {
            color: var(--og-red);
            font-weight: 700;
            letter-spacing: .12em;
            font-size: .76rem;
            text-transform: uppercase;
        }
        .hero h1 {
            font-size: clamp(2.1rem, 4.3vw, 3.2rem);
            font-weight: 800;
            color: #fff;
            line-height: 1.12;
        }
        .hero p {
            font-size: .98rem;
            color: rgba(255,255,255,.68);
            max-width: 500px;
            line-height: 1.65;
        }
        .hero-media-wrap {
            position: relative;
            padding-bottom: 26px;
        }
        .hero-frame {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--og-line);
            box-shadow: 0 20px 50px rgba(0,0,0,.45);
            aspect-ratio: 16 / 10;
            background: #101315;
        }
        .hero-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity .25s ease;
        }
        .hero-tag {
            position: absolute;
            right: 14px;
            bottom: 14px;
            background: rgba(15,17,19,.88);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,.14);
            color: #fff;
            font-size: .78rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            max-width: 90%;
            text-align: right;
        }
        .hero-controls {
            position: absolute;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hero-btn {
            background: #0f1113;
            border: 1px solid var(--og-line);
            color: rgba(255,255,255,.8);
            font-size: .72rem;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .hero-btn:hover {
            border-color: var(--og-red);
            color: #fff;
        }
        .hero-counter {
            background: #0f1113;
            border: 1px solid var(--og-line);
            color: rgba(255,255,255,.75);
            font-size: .74rem;
            padding: 3px 9px;
            border-radius: 4px;
            user-select: none;
        }

        /* Güven şeridi */
        .trust {
            background: #191d21;
            border-top: 1px solid var(--og-line);
            border-bottom: 1px solid var(--og-line);
        }
        .trust-item {
            padding: 20px 12px;
            text-align: center;
            font-size: .84rem;
            color: rgba(255,255,255,.62);
        }
        .trust-item strong {
            display: block;
            color: #fff;
            font-size: .95rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        /* Bölümler */
        .sec {
            padding: 72px 0;
        }
        .sec-title {
            font-size: clamp(1.5rem, 2.8vw, 2.05rem);
            font-weight: 700;
            color: #fff;
        }
        .sec-sub {
            color: rgba(255,255,255,.6);
            font-size: .94rem;
            max-width: 640px;
        }

        /* Hizmet kartları */
        .svc {
            background: var(--og-card);
            border: 1px solid var(--og-line);
            border-radius: 10px;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: transform .25s, border-color .25s;
            text-decoration: none;
            color: inherit;
        }
        .svc:hover {
            transform: translateY(-4px);
            border-color: var(--og-red);
            color: inherit;
        }
        .svc-media {
            position: relative;
            overflow: hidden;
            aspect-ratio: 16 / 10;
            background: #101315;
        }
        .svc-media.wide {
            aspect-ratio: 16 / 8.5;
        }
        .svc-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .35s;
        }
        .svc:hover .svc-media img {
            transform: scale(1.03);
        }
        .svc-badge {
            position: absolute;
            right: 10px;
            bottom: 10px;
            background: rgba(15,17,19,.86);
            color: #fff;
            font-size: .74rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 5px;
        }
        .svc-body {
            padding: 18px 20px 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .svc h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }
        .svc p {
            font-size: .86rem;
            color: rgba(255,255,255,.62);
            margin: 0;
            line-height: 1.5;
        }
        .svc .more {
            display: inline-block;
            margin-top: auto;
            padding-top: 12px;
            color: var(--og-red);
            font-weight: 600;
            font-size: .85rem;
        }

        /* Galeri */
        .gal-sec {
            background: #121518;
            border-top: 1px solid var(--og-line);
            border-bottom: 1px solid var(--og-line);
        }
        .gal {
            display: grid;
            grid-template-columns: 1.35fr 1fr 1fr;
            grid-template-rows: repeat(2, 190px);
            gap: 12px;
        }
        .gal-item {
            position: relative;
            display: block;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid var(--og-line);
            text-decoration: none;
        }
        .gal-item.main {
            grid-row: span 2;
        }
        .gal-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .35s;
        }
        .gal-item:hover img {
            transform: scale(1.04);
        }
        .gal-cap {
            position: absolute;
            left: 10px;
            right: 10px;
            bottom: 10px;
            background: rgba(15,17,19,.86);
            color: #fff;
            font-size: .75rem;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .gal-item.main .gal-cap {
            left: auto;
            font-size: .82rem;
            padding: 6px 12px;
        }

        /* Süreç */
        .step {
            border-left: 2px solid var(--og-red);
            padding: 2px 0 2px 16px;
            height: 100%;
        }
        .step b {
            color: var(--og-red);
            font-size: .95rem;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
        }
        .step h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin: 0 0 4px;
        }
        .step p {
            font-size: .85rem;
            color: rgba(255,255,255,.6);
            margin: 0;
            line-height: 1.5;
        }

        /* CTA & Footer */
        .cta {
            background: var(--og-red);
            color: #fff;
            padding: 24px 0;
        }
        .cta-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0;
        }
        .cta a.tel {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: .02em;
        }
        .cta a.tel:hover {
            text-decoration: underline;
        }
        .og-footer {
            background: #0e1012;
            color: rgba(255,255,255,.45);
            font-size: .78rem;
            padding: 18px 0;
            text-align: center;
        }

        /* Mobil sabit eylem çubuğu */
        .mbar { display: none; }
        @media (max-width: 991px) {
            .gal {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 220px repeat(2, 160px);
            }
            .gal-item.main {
                grid-column: span 2;
                grid-row: span 1;
            }
        }
        @media (max-width: 767px) {
            .sec { padding: 48px 0; }
            .hero { padding: 36px 0 44px; }
            .gal {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 200px repeat(2, 140px);
            }
            .mbar {
                display: flex;
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 1500;
