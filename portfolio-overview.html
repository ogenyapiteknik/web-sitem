<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="OGEN Yapı Teknik referans projeleri." />
        <meta name="author" content="OGEN Yapı Teknik" />
        <title>Referanslar | OGEN Yapı Teknik</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />
        <style>
            :root {
                --ogen-red: #D6121C;
                --ogen-dark: #263246;
            }

            .ref-section {
                padding: 4rem 0 0;
            }

            .ref-section > .container {
                max-width: 1400px;
            }

            .ref-intro {
                max-width: 780px;
                margin: 0 auto;
                text-align: center;
            }

            .ref-eyebrow {
                display: inline-block;
                margin-bottom: .65rem;
                color: var(--ogen-red);
                font-size: .9rem;
                font-weight: 800;
                letter-spacing: .12em;
                text-transform: uppercase;
            }

            .ref-title {
                margin: 0 0 .8rem;
                color: var(--ogen-dark);
                font-size: clamp(2rem, 3vw, 2.65rem);
                font-weight: 800;
            }

            .ref-line {
                width: 100%;
                height: 4px;
                border-radius: 4px;
                background: var(--ogen-red);
                margin: 0 auto;
            }

            @media (max-width: 767.98px) {
                .ref-section {
                    padding: 2.75rem 0 0;
                }
            }

            .ref-gallery {
                padding: 2.5rem 0 5rem;
            }

            .ref-gallery > .container {
                max-width: 1400px;
            }

            .ref-rows {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: .5rem;
            }

            .ref-rows + .ref-rows {
                margin-top: .85rem;
            }

            .ref-rows[hidden] {
                display: none;
            }

            .ref-chip {
                font: inherit;
                font-size: .95rem;
                font-weight: 700;
                padding: .55rem 1.15rem;
                border: 1px solid #e5e8ed;
                border-radius: 999px;
                background: #fff;
                color: var(--ogen-dark);
                cursor: pointer;
                transition: border-color .15s ease, color .15s ease, background .15s ease;
            }

            .ref-chip:hover {
                border-color: var(--ogen-red);
                color: var(--ogen-red);
            }

            .ref-chip:focus-visible {
                outline: 3px solid rgba(214, 18, 28, .35);
                outline-offset: 2px;
            }

            .ref-chip.is-active,
            .ref-chip.is-active:hover {
                background: var(--ogen-red);
                border-color: var(--ogen-red);
                color: #fff;
            }

            .ref-chip small {
                margin-left: .3rem;
                font-size: .85em;
                font-weight: 400;
                opacity: .75;
            }

            .ref-chip--sub {
                font-size: .85rem;
                font-weight: 600;
                padding: .4rem .9rem;
            }

            .ref-yol {
                margin: 1.5rem 0 1.25rem;
                text-align: center;
                color: #687487;
                font-size: .95rem;
            }

            .ref-grid {
                column-width: 240px;
                column-gap: 1rem;
            }

            .ref-item {
                position: relative;
                display: block;
                width: 100%;
                margin: 0 0 1rem;
                padding: 0;
                border: 0;
                border-radius: 12px;
                overflow: hidden;
                background: #f7f8fa;
                cursor: zoom-in;
                box-shadow: 0 5px 18px rgba(30, 42, 60, .055);
                break-inside: avoid;
                -webkit-column-break-inside: avoid;
            }

            .ref-item:focus-visible {
                outline: 3px solid rgba(214, 18, 28, .45);
                outline-offset: 2px;
            }

            .ref-item img {
                display: block;
                width: 100%;
                height: auto;
                transition: transform .3s ease;
            }

            .ref-item:hover img {
                transform: scale(1.04);
            }

            .ref-lb {
                position: fixed;
                inset: 0;
                z-index: 2000;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(10, 12, 16, .96);
            }

            .ref-lb[hidden] {
                display: none;
            }

            .ref-lb figure {
                margin: 0;
                max-width: 92vw;
                text-align: center;
            }

            .ref-lb img {
                display: block;
                max-width: 92vw;
                max-height: 82vh;
                margin: 0 auto;
                border-radius: 8px;
                background: #2b3035;
            }

            .ref-lb figcaption {
                margin-top: .75rem;
                color: #e9ecef;
                font-size: .95rem;
            }

            .ref-lb-btn {
                position: absolute;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 48px;
                height: 48px;
                border: 0;
                border-radius: 50%;
                background: rgba(255, 255, 255, .14);
                color: #fff;
                font-size: 1.8rem;
                line-height: 1;
                cursor: pointer;
            }

            .ref-lb-btn:hover {
                background: rgba(255, 255, 255, .28);
            }

            .ref-lb-btn:focus-visible {
                outline: 3px solid #fff;
                outline-offset: 2px;
            }

            .ref-lb-close { top: 16px; right: 16px; }
            .ref-lb-prev { left: 16px; top: 50%; transform: translateY(-50%); }
            .ref-lb-next { right: 16px; top: 50%; transform: translateY(-50%); }

            @media (max-width: 767.98px) {
                .ref-gallery {
                    padding-top: 2rem;
                }

                .ref-chip {
                    font-size: .85rem;
                    padding: .45rem .9rem;
                }

                .ref-chip--sub {
                    font-size: .8rem;
                    padding: .35rem .75rem;
                }

                .ref-lb-prev, .ref-lb-next {
                    top: auto;
                    bottom: 16px;
                    transform: none;
                }
            }

            @media (max-width: 575.98px) {
                .ref-grid {
                    column-count: 2;
                    column-width: auto;
                    column-gap: .6rem;
                }

                .
